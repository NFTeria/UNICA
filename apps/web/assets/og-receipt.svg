<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="UNICA">
<!--
  A LINK-PREVIEW RECIPE, NOT A PICTURE OF THE CARD. apps/web/build.mjs reads the shapes below,
  composites assets/mark.svg into the centre and writes the PNG a scraper actually fetches, so this
  file declares the ground and the band and nothing more.

  THERE IS NO TEXT HERE, AND THAT IS DELIBERATE. This project ships no font — the stylesheet is
  forbidden from fetching one — so a rasteriser has nothing to set a headline in. A card's words are
  og:title and og:description, which is where every scraper reads them from anyway. A card that drew
  its own headline would draw it in whatever the machine building the site happened to have.

  THE BAND IS THE ONLY THING THAT VARIES between cards, and it varies by FAMILY rather than by
  route: the reference pages: a receipt and what can be checked about it.
-->
<rect width="1200" height="630" fill="#fbfbfa"/>
<rect x="0" y="0" width="1200" height="12" fill="#14161a"/>
</svg>

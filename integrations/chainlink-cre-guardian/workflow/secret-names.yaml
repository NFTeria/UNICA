# Maps CRE secret IDs to the environment variable each value is read from.
#
# NAMES ONLY — no value appears in this file, which is why it is safe to commit.
#
# Named `secret-names.yaml` rather than the CRE default `secrets.yaml` because this repository's
# .gitignore carries a broad `secrets.*` rule. That rule is right for a public repo and weakening
# it with a negation to admit one safe file is how a real secret eventually slips through, so the
# file was renamed instead. `workflow.yaml` points `secrets-path` here.
secretsNames:
  unica_min_reserve:
    - UNICA_MIN_RESERVE
  unica_target_allocation_bps:
    - UNICA_TARGET_ALLOCATION_BPS
  unica_max_action_units:
    - UNICA_MAX_ACTION_UNITS
  unica_risk_threshold_bps:
    - UNICA_RISK_THRESHOLD_BPS
  unica_cooldown_seconds:
    - UNICA_COOLDOWN_SECONDS

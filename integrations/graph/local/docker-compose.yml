# A local graph-node for the end-to-end reconstruction (integrations/graph/local-e2e.sh). Pinned
# images; the Ethereum endpoint is the anvil fork the script starts on the host. The Postgres
# credentials are the graph-node project's own docker-compose example defaults for a throwaway
# local database and secure nothing; the stack is torn down with its volumes when the script ends.
services:
  graph-node:
    image: graphprotocol/graph-node:v0.38.0
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8020:8020"
      - "8030:8030"
      - "8040:8040"
    depends_on:
      - ipfs
      - postgres
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: "ipfs:5001"
      ethereum: "sepolia:http://host.docker.internal:8546"
      GRAPH_LOG: info
      ETHEREUM_REORG_THRESHOLD: "0"
      ETHEREUM_ANCESTOR_COUNT: "0"
  ipfs:
    image: ipfs/kubo:v0.34.1
    ports:
      - "5001:5001"
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-cshared_preload_libraries=pg_stat_statements", "-cmax_connections=200"]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"

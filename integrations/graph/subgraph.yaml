specVersion: 1.0.0
description: UNICA v5 settlements on Ethereum Sepolia — the market hook's
  receipts, the direct settler's receipts, and the catalogue's sales, from the
  three contracts recorded in deployments/unica-v4/11155111.json
repository: https://github.com/NFTeria/UNICA
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: UnicaMarketHook
    network: sepolia
    source:
      address: "0x2570a593e0D24ede29eC926e0c5a88B427b9A0c0"
      abi: UnicaMarketHook
      startBlock: 11690161
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Settlement
      abis:
        - name: UnicaMarketHook
          file: ./abis/UnicaMarketHook.json
      eventHandlers:
        - event: SettlementReceipt(indexed bytes32,indexed address,indexed
            address,bytes32,address,address,uint128,uint128,uint24,uint24,uint24,uint24,uint256,uint8,uint64,bool)
          handler: handleSettlementReceipt
      file: ./src/market.ts
  - kind: ethereum
    name: DirectSettlement
    network: sepolia
    source:
      address: "0x14a95db5463d27a97DF464001ec65d5DADffC88e"
      abi: DirectSettlement
      startBlock: 11691641
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Settlement
      abis:
        - name: DirectSettlement
          file: ./abis/DirectSettlement.json
      eventHandlers:
        - event: DirectReceipt(indexed bytes32,indexed address,indexed
            address,address,uint256,bytes32,uint64)
          handler: handleDirectReceipt
      file: ./src/direct.ts
  - kind: ethereum
    name: ProductCatalog
    network: sepolia
    source:
      address: "0xEf837110e2A60B4940E57570E5AD05f39d8C398A"
      abi: ProductCatalog
      startBlock: 11691641
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ProductSale
      abis:
        - name: ProductCatalog
          file: ./abis/ProductCatalog.json
      eventHandlers:
        - event: ProductSold(indexed uint256,indexed address,indexed
            address,address,address,uint256,uint8,uint64,bytes32)
          handler: handleProductSold
      file: ./src/product.ts

# NAMES ONLY — no value appears in this file, which is why it is safe to commit.
#
# Named `secret-names.yaml` rather than the CRE default `secrets.yaml` because this repository's
# .gitignore carries a broad `secrets.*` rule; the default name would be silently untracked and the
# mapping would go missing from a fresh clone.
secretsNames:
  QUOTE_CREDENTIAL:
    - UNICA_RH_QUOTE_CREDENTIAL
  MAX_DEVIATION_BPS:
    - UNICA_RH_MAX_DEVIATION_BPS
  MAX_QUOTE_AGE_SECONDS:
    - UNICA_RH_MAX_QUOTE_AGE_SECONDS
  MIN_MERCHANT_OUT:
    - UNICA_RH_MIN_MERCHANT_OUT
  PREFERRED_VENUE:
    - UNICA_RH_PREFERRED_VENUE
  SUBMISSION_CONFIG:
    - UNICA_RH_SUBMISSION_CONFIG

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">UNICA — a merchant's till becomes a portfolio, and the portfolio still spends</title>
<desc id="d">Project banner, dark. Wordmark UNICA, the brand line, and two status rows: exact settlement through Uniswap v4 is live on Ethereum Sepolia; treasury automation and confidential execution are being built. Built by NFTeria, independent.</desc>

<!-- UNICA project banner, 1600x900, DARK. Same geometry as the light file; only the palette differs.
     PALETTE is the product's dark block, lifted from web/index.html @media (prefers-color-scheme: dark):
       ink #F2F2EF · paper #121212 · accent #35B888 · muted #9AA0A6 · line #2A2C30
     Measured on this ground: ink 16.70:1, muted 7.09:1, accent 7.46:1 (all pass WCAG AA).
     The accent is still spent on one thing only: the filled dot on the claim that is actually live. -->

<rect width="1600" height="900" fill="#121212"/>
<rect x="0.5" y="0.5" width="1599" height="899" fill="none" stroke="#2A2C30"/>

<g font-family='ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'>

  <text x="396" y="248" font-size="104" font-weight="700" letter-spacing="4.2" fill="#F2F2EF">UNICA</text>
  <line x1="396" y1="296.5" x2="1203" y2="296.5" stroke="#2A2C30" stroke-width="1"/>

  <text x="396" y="376" font-size="46" font-weight="400" fill="#F2F2EF">A merchant's till becomes a portfolio —</text>
  <text x="396" y="440" font-size="46" font-weight="400" fill="#F2F2EF">and the portfolio still spends.</text>

  <circle cx="404" cy="623" r="7.5" fill="#35B888"/>
  <text x="434" y="632" font-size="25" font-weight="500" fill="#F2F2EF">Exact settlement through Uniswap v4 is live on Ethereum Sepolia.</text>

  <line x1="396" y1="663.5" x2="1203" y2="663.5" stroke="#2A2C30" stroke-width="1"/>

  <circle cx="404" cy="687" r="6.75" fill="none" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="434" y="696" font-size="25" font-weight="400" fill="#9AA0A6">Treasury automation and confidential execution are being built.</text>

  <line x1="396" y1="812.5" x2="1203" y2="812.5" stroke="#2A2C30" stroke-width="1"/>
  <text x="396" y="848" font-size="16" font-weight="400" fill="#9AA0A6">Built by NFTeria · Independent — not affiliated with or endorsed by Uniswap.</text>

</g>
</svg>

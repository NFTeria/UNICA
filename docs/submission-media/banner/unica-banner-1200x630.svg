<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
<title id="t">UNICA — a merchant's till becomes a portfolio, and the portfolio still spends</title>
<desc id="d">Social card. Wordmark UNICA, the brand line, and two status rows: exact settlement through Uniswap v4 is live on Ethereum Sepolia; treasury automation and confidential execution are being built. Built by NFTeria, independent.</desc>

<!-- UNICA social card, 1200x630 (the 1.91:1 Open Graph / link-preview size).
     Laid out natively rather than scaled from the 1600x900 file, because 1.905:1 is not 16:9;
     the type scale is re-derived so the column still survives a 1:1 centre crop (x 285..915).
     PALETTE is the product's, from web/index.html :root:
       ink #14161A · paper #FBFBFA · accent #0B6E4F · muted #5B6169 · line #E4E4E1
     Measured on this ground: ink 17.49:1, muted 6.04:1, accent 6.04:1 (all pass WCAG AA).
     The accent is spent on one thing only: the filled dot on the claim that is actually live.
     Hand-written: no script, no external references, no web fonts. -->

<rect width="1200" height="630" fill="#FBFBFA"/>
<rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#E4E4E1"/>

<g font-family='ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'>

  <text x="328" y="174" font-size="72" font-weight="700" letter-spacing="2.9" fill="#14161A">UNICA</text>
  <line x1="328" y1="207.5" x2="872" y2="207.5" stroke="#E4E4E1" stroke-width="1"/>

  <text x="328" y="263" font-size="31" font-weight="400" fill="#14161A">A merchant's till becomes a portfolio —</text>
  <text x="328" y="308" font-size="31" font-weight="400" fill="#14161A">and the portfolio still spends.</text>

  <circle cx="333" cy="436" r="5.25" fill="#0B6E4F"/>
  <text x="354" y="442" font-size="17" font-weight="500" fill="#14161A">Exact settlement through Uniswap v4 is live on Ethereum Sepolia.</text>

  <line x1="328" y1="464.5" x2="872" y2="464.5" stroke="#E4E4E1" stroke-width="1"/>

  <circle cx="333" cy="481" r="4.7" fill="none" stroke="#5B6169" stroke-width="1.2"/>
  <text x="354" y="487" font-size="17" font-weight="400" fill="#5B6169">Treasury automation and confidential execution are being built.</text>

  <line x1="328" y1="568.5" x2="872" y2="568.5" stroke="#E4E4E1" stroke-width="1"/>
  <text x="328" y="594" font-size="12" font-weight="400" fill="#5B6169">Built by NFTeria · Independent — not affiliated with or endorsed by Uniswap.</text>

</g>
</svg>

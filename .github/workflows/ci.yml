name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned on purpose. A toolchain is never changed mid-build; "stable" moves under you.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Record the toolchain
        run: forge --version

      # The submodule pin is load-bearing. A recursive update run before the pin was staged
      # silently resets a tag checkout to whatever the superproject recorded. Fail here, loudly,
      # rather than build against an unintended revision.
      - name: Assert the uniswap-hooks pin
        run: |
          # The checkout fetches submodules without tags, so fetch the one tag that matters and
          # prove it resolves to the pinned commit, then prove HEAD is that commit.
          git -C lib/uniswap-hooks fetch --no-tags --depth 1 origin tag v1.1.1
          test "$(git -C lib/uniswap-hooks rev-parse 'v1.1.1^{commit}')" = "bd5287c4a9f5c22c2393f7587a9b357662916115"
          test "$(git -C lib/uniswap-hooks rev-parse HEAD)" = "bd5287c4a9f5c22c2393f7587a9b357662916115"
          echo "uniswap-hooks pinned at v1.1.1 = bd5287c"

      - name: forge build
        run: forge build --sizes

      # A lane that ran zero tests is not a green lane. Require the total, not just the exit code.
      - name: forge test
        run: |
          set -o pipefail
          forge test -vvv 2>&1 | tee test.log
          total=$(grep -oE '\(([0-9]+) total tests\)' test.log | grep -oE '[0-9]+')
          echo "tests run: ${total:-0}"
          test "${total:-0}" -ge 7

      - name: forge fmt --check
        run: forge fmt --check

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every commit is authored AND committed under the project identity alone, and no message
      # carries an attribution shape: a co-author trailer naming a tool, a "generated with"
      # line, or the robot-emoji banner. Checked against the whole history on every push.
      # (Bare tool names in prose are the local pre-commit hook's job, where they can still be
      # fixed; a pushed message is permanent, so this job checks the shapes that grant credit.)
      - name: Single author, no AI attribution
        run: |
          identities=$(git log --format='%an <%ae>%n%cn <%ce>' | sort -u)
          echo "identities: $identities"
          test "$identities" = "NFTeria <dev@nfteria.click>"
          if git log --format='%B' | grep -inE 'co-authored-by:[[:space:]]*(claude|anthropic|copilot|chatgpt|gpt-|openai|cursor|codex)|generated[[:space:]]+with[[:space:]]+\[?(claude|chatgpt|copilot|cursor)|🤖[[:space:]]*generated'; then
            echo "AI attribution found in history"; exit 1
          fi
          echo "history clean: one identity, no attribution shapes"

      - name: No secrets in the tree
        run: |
          if git grep -nE 'PRIVATE_KEY=|MNEMONIC=|0x[a-fA-F0-9]{64}' -- . ':!lib' ':!*.lock'; then
            echo "possible secret in the tree"; exit 1
          fi
          echo "no secret-shaped strings outside lib/"

name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned on purpose. A toolchain is never changed mid-build; "stable" moves under you.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Record the toolchain
        run: forge --version

      # The compiler is fetched from binaries.soliditylang.org on first use; a reset connection
      # there turned the gate red once with no change in this tree. Cache it between runs and
      # retry the fetch, loudly, so a network blip is a logged retry and not a false red.
      - name: Cache solc
        uses: actions/cache@v4
        with:
          path: ~/.svm
          key: solc-${{ runner.os }}-0.8.26-0.8.30

      - name: Fetch the compilers, retrying on a network failure
        run: |
          for attempt in 1 2 3; do
            if forge build --skip test --skip script >/dev/null 2>build.err; then echo "compilers present (attempt $attempt)"; exit 0; fi
            echo "attempt $attempt failed:"; tail -3 build.err; sleep 15
          done
          echo "compiler fetch failed three times"; exit 1

      # The submodule pin is load-bearing. A recursive update run before the pin was staged
      # silently resets a tag checkout to whatever the superproject recorded. Fail here, loudly,
      # rather than build against an unintended revision.
      - name: Assert the uniswap-hooks pin
        run: |
          # The checkout fetches submodules without tags, so fetch the one tag that matters and
          # prove it resolves to the pinned commit, then prove HEAD is that commit.
          git -C lib/uniswap-hooks fetch --no-tags --depth 1 origin tag v1.1.1
          test "$(git -C lib/uniswap-hooks rev-parse 'v1.1.1^{commit}')" = "bd5287c4a9f5c22c2393f7587a9b357662916115"
          test "$(git -C lib/uniswap-hooks rev-parse HEAD)" = "bd5287c4a9f5c22c2393f7587a9b357662916115"
          echo "uniswap-hooks pinned at v1.1.1 = bd5287c"

      # Not --sizes: that flag fails the build when ANY compiled contract exceeds EIP-170, and
      # v4-core's PoolManager, compiled here without via_ir for the local tests, does. The
      # contract this repository ships is checked on its own.
      - name: forge build
        run: forge build

      - name: Assert the hook is under the EIP-170 runtime limit
        run: |
          hex=$(forge inspect src/UnicaHook.sol:UnicaHook deployedBytecode)
          bytes=$(( (${#hex} - 2) / 2 ))
          echo "UnicaHook runtime bytes: $bytes"
          test "$bytes" -le 24576

      # A lane that ran zero tests is not a green lane. Require the total, not just the exit code.
      - name: forge test
        run: |
          set -o pipefail
          forge test -vvv 2>&1 | tee test.log
          total=$(grep -oE '\(([0-9]+) total tests\)' test.log | grep -oE '[0-9]+')
          echo "tests run: ${total:-0}"
          test "${total:-0}" -ge 7

      - name: forge fmt --check
        run: forge fmt --check

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every commit is authored AND committed under the project identity alone, and no message
      # carries an attribution shape: a co-author trailer naming a tool, a "generated with"
      # line, or the robot-emoji banner. Checked against the whole history on every push.
      # (Bare tool names in prose are the local pre-commit hook's job, where they can still be
      # fixed; a pushed message is permanent, so this job checks the shapes that grant credit.)
      - name: Single author, no AI attribution
        run: |
          identities=$(git log --format='%an <%ae>%n%cn <%ce>' | sort -u)
          echo "identities: $identities"
          test "$identities" = "NFTeria <dev@nfteria.click>"
          if git log --format='%B' | grep -inE 'co-authored-by:[[:space:]]*(claude|anthropic|copilot|chatgpt|gpt-|openai|cursor|codex)|generated[[:space:]]+with[[:space:]]+\[?(claude|chatgpt|copilot|cursor)|🤖[[:space:]]*generated'; then
            echo "AI attribution found in history"; exit 1
          fi
          echo "history clean: one identity, no attribution shapes"

      # A private key is 32 bytes, and so is a pool id, a salt, a transaction hash, and a
      # commit-pinned checksum; bare length proves nothing. Fail on labelled secrets and known
      # token formats, and on a bare 32-byte hex value only when nothing on its line says what
      # it is. Every hit is printed so a human can read it either way.
      # This repository is public and the planning that produced it is private. No tracked path
      # may carry a private runtime file name, and no tracked file may mention the private
      # locations. The step proves itself on a planted line before judging the tree.
      - name: No private material in the tree
        run: |
          names='^(STATE|MVP-PATH|SLOT-DECISION|BATTLE-PLAN|PLAYBOOK|PREBUILD|BOOTSTRAP|SESSION-PROMPT|ANSWERS|HANDOFF|SPONSORS|SPONSOR-BRIEF|LAW|PRIZE|SHIP|WHOSE-PROJECT|HOOK-CRAFT|UNISWAP-GITHUB|FEEDBACK-PLAN|FEEDBACK-DISCIPLINE|QUESTIONS|REMINDERS|PURSUIT-KIT|IDENTITY-RULING|WINNERS-EVIDENCE|UNISWAP-NEEDS|UF-SKILL-REVIEW|CHAIN-ADVANTAGES|INSIDE-THE-STACK|CHAINS|DISCIPLINE)\.md$|^(unica-closet|prize-watch|sponsors|routines|critique|do-not-ship|pseudocode|day1|warroom|war-room)/|\.REFERENCE$|\.output$'
          # Locations, not words: the templates and the unedited spec use "war-room" in prose.
          marks='unica-closet|claude-toolkit|SESSION-PROMPT|prize-watch/|/Users/'
          printf 'see /Users/someone/notes\n' | grep -qE "$marks" || { echo "control failed: planted private path not caught"; exit 1; }
          printf 'STATE.md\n' | grep -qE "$names" || { echo "control failed: planted private name not caught"; exit 1; }
          echo "controls passed"
          if git ls-files | grep -E "$names"; then echo "a private runtime file is tracked"; exit 1; fi
          # .gitignore names the tripwires on purpose; specs/ is published unedited.
          if git grep -nE "$marks" -- . ':!lib' ':!.github/workflows/ci.yml' ':!.gitignore' ':!specs/'; then echo "a private location is mentioned"; exit 1; fi
          echo "no private material in the tree"

      - name: No secrets in the tree
        run: |
          fail=0
          if git grep -nE '(PRIVATE_KEY|MNEMONIC|SECRET|API_KEY|AUTH_TOKEN|PASSWORD)[A-Z_]*[[:space:]]*=[[:space:]]*[^[:space:]<$]{8,}|"ciphertext"|ghp_[A-Za-z0-9]{36}|sk-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}' -- . ':!lib' ':!.github/workflows/ci.yml'; then
            echo "labelled secret or token format found"; fail=1
          fi
          label='pool ?id|salt|hash|keccak|sha-?256|tx|transaction|block|bytes32|id[[:space:]]'
          # The step proves itself first: a planted labelled key, a planted bare value inside a
          # Markdown table row, and a labelled pool id. The first two must be caught, the third must pass.
          printf 'PRIVATE_KEY=0x%064d\n' 1 | grep -qE '(PRIVATE_KEY|MNEMONIC|SECRET|API_KEY|AUTH_TOKEN|PASSWORD)[A-Z_]*[[:space:]]*=[[:space:]]*[^[:space:]<$]{8,}' || { echo "control failed: labelled key not caught"; exit 1; }
          printf '| key | 0x%064d |\n' 2 | grep -E '0x[a-fA-F0-9]{64}' | grep -qviE "$label" || { echo "control failed: bare value in a table row not caught"; exit 1; }
          printf 'pool id 0x%064d\n' 3 | grep -E '0x[a-fA-F0-9]{64}' | grep -qviE "$label" && { echo "control failed: labelled pool id flagged"; exit 1; }
          echo "controls passed"
          bare=$(git grep -nE '0x[a-fA-F0-9]{64}' -- . ':!lib' | grep -viE "$label" || true)
          if [ -n "$bare" ]; then
            echo "$bare"; echo "bare 32-byte hex value with no label on its line"; fail=1
          fi
          test "$fail" -eq 0 && echo "no secret-shaped strings outside lib/"

name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pinned on purpose. A toolchain is never changed mid-build; "stable" moves under you.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Record the toolchain
        run: forge --version

      # The compiler is fetched from binaries.soliditylang.org on first use; a reset connection
      # there turned the gate red once with no change in this tree. Cache it between runs and
      # retry the fetch, loudly, so a network blip is a logged retry and not a false red.
      - name: Cache solc
        uses: actions/cache@v4
        with:
          path: ~/.svm
          key: solc-${{ runner.os }}-0.8.30

      - name: Fetch the compilers, retrying on a network failure
        run: |
          for attempt in 1 2 3; do
            if forge build --skip test --skip script >/dev/null 2>build.err; then echo "compilers present (attempt $attempt)"; exit 0; fi
            echo "attempt $attempt failed:"; tail -3 build.err; sleep 15
          done
          echo "compiler fetch failed three times"; exit 1

      # The submodule pin is load-bearing. A recursive update run before the pin was staged
      # silently resets a tag checkout to whatever the superproject recorded. Fail here, loudly,
      # rather than build against an unintended revision.
      - name: Assert the uniswap-hooks pin
        run: |
          # The checkout fetches submodules without tags, so fetch the one tag that matters and
          # prove it resolves to the pinned commit, then prove HEAD is that commit.
          git -C lib/uniswap-hooks fetch --no-tags --depth 1 origin tag v1.1.1
          test "$(git -C lib/uniswap-hooks rev-parse 'v1.1.1^{commit}')" = "bd5287c4a9f5c22c2393f7587a9b357662916115"
          test "$(git -C lib/uniswap-hooks rev-parse HEAD)" = "bd5287c4a9f5c22c2393f7587a9b357662916115"
          echo "uniswap-hooks pinned at v1.1.1 = bd5287c"

      # Not --sizes: that flag fails the build when ANY compiled contract exceeds EIP-170, and
      # v4-core's PoolManager, compiled here without via_ir for the local tests, does. The
      # contract this repository ships is checked on its own.
      - name: forge build
        run: forge build

      - name: Assert both contracts are under the EIP-170 runtime limit
        run: |
          for c in src/V4SettlementHook.sol:V4SettlementHook src/SettlementExecutor.sol:SettlementExecutor; do
            hex=$(forge inspect "$c" deployedBytecode)
            bytes=$(( (${#hex} - 2) / 2 ))
            echo "$c runtime bytes: $bytes"
            test "$bytes" -le 24576
          done

      # A lane that ran fewer tests than the tree declares is not a green lane. The expected count is
      # read from the test sources, so a test that stops running (a typo in its name, a file that
      # stops compiling into the suite) turns this red instead of vanishing.
      - name: forge test
        run: |
          set -o pipefail
          forge test -vvv 2>&1 | tee test.log
          total=$(grep -oE '\(([0-9]+) total tests\)' test.log | grep -oE '[0-9]+')
          expected=$(grep -rhoE 'function test[A-Za-z0-9_]*\(' test --include='*.t.sol' | wc -l | tr -d ' ')
          echo "tests run: ${total:-0}, declared in test/: $expected"
          test "${total:-0}" -eq "$expected"

      - name: forge fmt --check
        run: forge fmt --check

  # A stranger's path, exactly: clone the public repository without submodules, fetch them
  # with the Makefile, run the gate. If this lane is red, the README's setup is a lie.
  fresh-clone:
    runs-on: ubuntu-latest
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Clone like a stranger and run the gate
        run: |
          git clone --no-recurse-submodules https://github.com/${{ github.repository }}.git stranger
          cd stranger
          # On a pull_request event github.sha is a merge commit the public clone does not have.
          git checkout --quiet ${{ github.event.pull_request.head.sha || github.sha }}
          make gate 2>&1 | tail -2 || true
          make deps
          make doctor
          set -o pipefail
          make gate 2>&1 | tee gate.log
          total=$(grep -oE '\(([0-9]+) total tests\)' gate.log | grep -oE '[0-9]+')
          expected=$(grep -rhoE 'function test[A-Za-z0-9_]*\(' test --include='*.t.sol' | wc -l | tr -d ' ')
          echo "tests run on the fresh clone: ${total:-0}, declared: $expected"
          test "${total:-0}" -eq "$expected"

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every commit is authored AND committed under the project identity alone, and no message
      # carries an attribution shape: a co-author trailer naming a tool, a "generated with"
      # line, or the robot-emoji banner. Checked against the whole history on every push.
      # (Bare tool names in prose are the local pre-commit hook's job, where they can still be
      # fixed; a pushed message is permanent, so this job checks the shapes that grant credit.)
      - name: Single author, no AI attribution
        run: |
          identities=$(git log --format='%an <%ae>%n%cn <%ce>' | sort -u)
          echo "identities: $identities"
          test "$identities" = "NFTeria <dev@nfteria.click>"
          if git log --format='%B' | grep -inE 'co-authored-by:[[:space:]]*(claude|anthropic|copilot|chatgpt|gpt-|openai|cursor|codex)|generated[[:space:]]+with[[:space:]]+\[?(claude|chatgpt|copilot|cursor)|🤖[[:space:]]*generated'; then
            echo "AI attribution found in history"; exit 1
          fi
          echo "history clean: one identity, no attribution shapes"

      # One definition of these rules, in script/scan.sh, so a developer can run exactly what CI
      # runs before pushing. The script proves each pattern on a planted input before judging the
      # tree, and prints a stated count. (Measured 2026-09-05: CI and a local copy of the same
      # regex drifted, and four pushes went red on a rule the local run did not have.)
      - name: No secrets or private material in the tree
        run: bash script/scan.sh

[profile.default]
src    = "src"
out    = "out"
libs   = ["lib"]
test   = "test"
script = "script"

# Pinned. The tree first shipped without a pin so v4-core's exact-pinned PoolManager.sol
# (`pragma solidity 0.8.26`) could compile inside the test unit; the price, measured on day 1,
# was two builds of the hook (0.8.26 in tests, 0.8.30 in the script that deployed) and a
# rejected verification until the matching artifact was found. The tests now deploy the
# official PoolManager BYTECODE from hookmate's artifact instead of compiling it, so nothing
# in the tree needs 0.8.26 and one compiler serves tests, scripts, and verification. This is
# the version the template pins and the version the day-1 hook was verified with.
solc_version = "0.8.30"
evm_version = "cancun"        # v4 requires transient storage (EIP-1153)
via_ir      = false

# These two make a mined CREATE2 salt reproducible on any machine.
bytecode_hash = "none"
cbor_metadata = false

ffi            = false
fs_permissions = []

[fmt]
line_length     = 120
tab_width       = 4
bracket_spacing = false
int_types       = "long"

# Fuzzing a v4 swap is nearly free on this stack (measured: 10,000 runs in about a second), so
# the count is high and CI runs the same number. Lowering it is a change that needs a reason.
[fuzz]
runs = 10000

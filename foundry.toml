[profile.default]
src    = "src"
out    = "out"
libs   = ["lib"]
test   = "test"
script = "script"

# Pinned. The tree first shipped without a pin so v4-core's exact-pinned PoolManager.sol
# (`pragma solidity 0.8.26`) could compile inside the test unit; the price, measured on day 1,
# was two builds of the hook (0.8.26 in tests, 0.8.30 in the script that deployed) and a
# rejected verification until the matching artifact was found. The tests now deploy the
# official PoolManager BYTECODE from hookmate's artifact instead of compiling it, so nothing
# in the tree needs 0.8.26 and one compiler serves tests, scripts, and verification. This is
# the version the template pins and the version the day-1 hook was verified with.
solc_version = "0.8.30"
evm_version = "cancun"        # v4 requires transient storage (EIP-1153)
via_ir      = false

# These two make a mined CREATE2 salt reproducible on any machine.
bytecode_hash = "none"
cbor_metadata = false

ffi            = false
fs_permissions = []

[fmt]
line_length     = 120
tab_width       = 4
bracket_spacing = false
int_types       = "long"

# Fuzzing a v4 swap is nearly free on this stack (measured: 10,000 runs in about a second), so
# the count is high and CI runs the same number. Lowering it is a change that needs a reason.
[fuzz]
runs = 10000

# ---- RPC endpoints -----------------------------------------------------------------------------
# `cast --rpc-url robinhood_testnet` and `forge script --rpc-url unichain_sepolia` resolve from
# here, so a chain is named once and never pasted into a command again.
#
# EVERY ENTRY IS AN ENVIRONMENT REFERENCE, NEVER A URL. A provider endpoint carries its API key in
# the path, which makes the whole URL a credential — and this repository is public. `${VAR}` keeps
# the value in .env (gitignored, chmod 600) where `script/rpc-setup.sh` puts it, and keeps this
# file safe for anyone to read.
#
# EVERY ALIAS IS A BARE ${VAR}, AND THAT IS DELIBERATE. Foundry has no `${VAR:-default}` syntax —
# it reads the whole `VAR:-https://...` as ONE variable name and fails with "environment variable
# not found". This file carried that mistake briefly and every alias was dead; `script/rpc-setup.sh`
# now guarantees a value exists instead, writing the keyless public endpoint when you do not supply
# one. Those public endpoints are rate-limited and demonstrably flaky under load — see
# docs/proof/retry.sh for what that cost — so supply real ones for anything that matters.
#
# THE MAINNET ENTRIES HAVE NO FALLBACK, DELIBERATELY. UNICA is testnet-only: nothing in this
# repository has ever been deployed to or broadcast on a mainnet, and `script/mainnet-guard.sh`
# refuses one by chain id. The aliases exist so a READ against mainnet is possible — comparing a
# deployed router's bytecode against the mainnet build is exactly the kind of check this project
# does — and an unset variable simply fails rather than silently reaching a public mainnet node.
[rpc_endpoints]
# --- TESTNETS. Every one of these is a testnet and its name says so. ---
sepolia_testnet    = "${SEPOLIA_TESTNET_RPC_URL}"
arbitrum_testnet   = "${ARBITRUM_TESTNET_RPC_URL}"
base_testnet       = "${BASE_TESTNET_RPC_URL}"
unichain_testnet   = "${UNICHAIN_TESTNET_RPC_URL}"
robinhood_testnet  = "${ROBINHOOD_TESTNET_RPC_URL}"
# A SECOND endpoint for chain 46630, added 2026-09-10. It does NOT replace the line above and
# nothing redirects to it: `robinhood_testnet` resolves exactly as it did before, and this alias
# is reached only by naming it. Written as a literal because it is keyless and therefore not a
# credential — every other entry here is a variable precisely because it carries a key in its path.
# It is served through the Blockscout explorer for this chain; whether its upstream is operated
# independently of the primary endpoint has NOT been established, so it is a second access path
# rather than proven redundancy. Verified: cast chain-id -> 46630, cast block-number, eth_call,
# and JSON-RPC batch. See docs/chains/ROBINHOOD.md section 0.5.
robinhood_testnet_explorer = "https://explorer.testnet.chain.robinhood.com/api/eth-rpc"
arc_testnet        = "${ARC_TESTNET_RPC_URL}"

# --- MAINNETS. Read-only comparison. No fallback, so an unset one fails instead of
#     quietly reaching a public mainnet node. script/mainnet-guard.sh refuses these by chain id. ---
ethereum_mainnet   = "${ETHEREUM_MAINNET_RPC_URL}"
arbitrum_mainnet   = "${ARBITRUM_MAINNET_RPC_URL}"
base_mainnet       = "${BASE_MAINNET_RPC_URL}"
unichain_mainnet   = "${UNICHAIN_MAINNET_RPC_URL}"
robinhood_mainnet  = "${ROBINHOOD_MAINNET_RPC_URL}"

[profile.default]
src    = "src"
out    = "out"
libs   = ["lib"]
test   = "test"
script = "script"

# solc_version is deliberately unpinned. v4-core's PoolManager.sol carries the exact
# pragma `0.8.26` (no caret), the only such file in v4-core; a global pin above it has
# an empty intersection and the first build that deploys the concrete PoolManager
# fails. Letting forge resolve per file compiles the whole tree at 0.8.26. Any file
# here that imports the concrete PoolManager must itself admit 0.8.26 (^0.8.26).
#
# This is settled before any hook address is mined: the compiler sets the bytecode,
# the bytecode sets the init-code hash, and the hash sets the CREATE2 salt.
evm_version = "cancun"        # v4 requires transient storage (EIP-1153)
via_ir      = false

# These two make a mined CREATE2 salt reproducible on any machine.
bytecode_hash = "none"
cbor_metadata = false

ffi            = false
fs_permissions = []

[fmt]
line_length     = 120
tab_width       = 4
bracket_spacing = false
int_types       = "long"
